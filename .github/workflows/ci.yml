name: verify-consumer

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify vendored NRW source hashes
        run: sha256sum -c vendor/SOURCE-HASHES.sha256
      - name: Verify recorded evidence fixture hashes
        run: sha256sum -c fixtures/FIXTURE-HASHES.sha256
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck and run deterministic consumer witness
        run: npm run check
